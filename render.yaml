services:
  - type: web
    name: resizer-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 50
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 4000
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: test
      - key: DB_SSL
        value: true
      - key: DB_CONNECTION_LIMIT
        value: 5
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPERADMIN_EMAIL
        value: resizer@anas.com
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: VENICE_API_KEY
        sync: false
      - key: VENICE_BASE_URL
        value: https://api.venice.ai/api/v1
      - key: VENICE_IMAGE_MODEL
        value: fluently-xl
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      # Image hosting (imgbb). sync: false -> paste your client API key from
      # https://api.imgbb.com/user/api_key into Render's environment.
      - key: IMGBB_API_KEY
        sync: false
      - key: IMGBB_TIMEOUT_MS
        value: "30000"
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
